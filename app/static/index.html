<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eConsult-Intel | Ministry of Corporate Affairs (MCA) Policy Intelligence Platform</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React 18 and Babel for standalone runtime -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border-color: #e2e8f0;
      --border-strong: #cbd5e1;
      
      /* Stance Colors */
      --favor-base: #10b981;
      --favor-bg: #ecfdf5;
      --favor-border: #a7f3d0;
      --favor-text: #065f46;

      --against-base: #ef4444;
      --against-bg: #fef2f2;
      --against-border: #fecaca;
      --against-text: #991b1b;

      --none-base: #64748b;
      --none-bg: #f1f5f9;
      --none-border: #cbd5e1;
      --none-text: #334155;

      /* Campaign / Astroturf Colors */
      --camp-base: #f59e0b;
      --camp-bg: #fffbeb;
      --camp-border: #fde68a;
      --camp-text: #92400e;

      /* Primary Theme */
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Government National Accent Bar */
    .top-tricolor {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, #ff9933 0%, #ff9933 33.3%, #ffffff 33.3%, #ffffff 66.6%, #138808 66.6%, #138808 100%);
    }

    /* Global Container */
    .app-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 14px 20px 30px;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      border-radius: var(--radius);
      padding: 16px 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-icon {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .header-titles h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-titles p {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 2px;
    }
    .header-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .h-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .h-badge-sih {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      font-weight: 700;
    }

    /* Tripartite Pillars Bar */
    .pillars-bar {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 10px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 900px) {
      .pillars-bar { grid-template-columns: 1fr; }
    }
    .pillar-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .pillar-icon {
      font-size: 18px;
      line-height: 1.2;
    }
    .pillar-text h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .pillar-text p {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
      margin-top: 2px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 800;
      font-family: var(--font-sans);
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .stat-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Clause Selector Tabs */
    .clause-section-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clause-scroll {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }
    .clause-card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
    }
    .clause-card:hover {
      border-color: var(--primary);
      background: #fdfdfd;
      transform: translateY(-1px);
    }
    .clause-card.active {
      border-color: var(--primary);
      background: var(--primary-light);
      box-shadow: 0 0 0 2px var(--primary-border);
    }
    .clause-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .clause-code {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
      color: var(--text-main);
    }
    .clause-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }
    .clause-title {
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .clause-card.active .clause-title {
      color: var(--primary-dark);
      font-weight: 600;
    }
    .meter-bar {
      display: flex;
      height: 6px;
      width: 100%;
      border-radius: 999px;
      overflow: hidden;
      background: #e2e8f0;
    }
    .meter-favor { background: var(--favor-base); }
    .meter-against { background: var(--against-base); }
    .meter-none { background: var(--none-base); }

    /* Main Dual Pane Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
      min-height: 700px;
    }
    @media (max-width: 1050px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    /* Left Pane: Submissions Feed */
    .feed-panel {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .feed-header {
      padding: 12px 14px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feed-search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-box {
      flex: 1;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 7px 10px 7px 30px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      background: var(--surface-subtle);
      transition: all 0.15s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 12px;
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .btn-pill {
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-pill:hover {
      background: var(--surface-subtle);
      color: var(--text-main);
    }
    .btn-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .btn-pill-favor.active {
      background: var(--favor-base);
      border-color: var(--favor-base);
      color: #ffffff;
    }
    .btn-pill-against.active {
      background: var(--against-base);
      border-color: var(--against-base);
      color: #ffffff;
    }
    .btn-pill-camp {
      background: var(--camp-bg);
      border-color: var(--camp-border);
      color: var(--camp-text);
    }
    .btn-pill-camp.active {
      background: var(--camp-base);
      border-color: var(--camp-base);
      color: #ffffff;
    }
    .active-filter-tag {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .active-filter-tag:hover {
      background: #e2e8f0;
    }

    /* Comment Cards List */
    .feed-list {
      padding: 12px;
      overflow-y: auto;
      max-height: 750px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
    }
    .comment-card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
      box-shadow: var(--shadow-sm);
      border-left: 4px solid var(--none-base);
      transition: all 0.15s ease;
    }
    .comment-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }
    .comment-card.favor { border-left-color: var(--favor-base); }
    .comment-card.against { border-left-color: var(--against-base); }
    .comment-card.none { border-left-color: var(--none-base); }
    .comment-card.is-campaign {
      background: #fffdfa;
      border-color: #fde68a;
    }
    .comment-card.highlighted {
      background: #fefce8 !important;
      border-color: #facc15 !important;
      box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.3) !important;
    }

    .comment-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      margin-bottom: 7px;
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-cid {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #334155;
    }
    .badge-clause {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: #1e40af;
    }
    .badge-favor {
      background: var(--favor-bg);
      border-color: var(--favor-border);
      color: var(--favor-text);
    }
    .badge-against {
      background: var(--against-bg);
      border-color: var(--against-border);
      color: var(--against-text);
    }
    .badge-none {
      background: var(--none-bg);
      border-color: var(--none-border);
      color: var(--none-text);
    }
    .badge-camp {
      background: var(--camp-bg);
      border-color: var(--camp-border);
      color: var(--camp-text);
      cursor: pointer;
    }
    .badge-camp:hover {
      background: #fef3c7;
    }
    .badge-stakeholder {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #475569;
    }
    .badge-ai {
      background: #faf5ff;
      border-color: #e9d5ff;
      color: #6b21a8;
    }
    .comment-body {
      font-size: 12.5px;
      line-height: 1.5;
      color: #1e293b;
    }

    /* Right Pane: Intelligence Hub */
    .intel-panel {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tab-header {
      display: flex;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
    }
    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      border-bottom: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn:hover {
      color: var(--text-main);
      background: var(--surface-subtle);
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: #ffffff;
    }

    .tab-body {
      padding: 16px;
      overflow-y: auto;
      max-height: 750px;
    }

    /* Summary Section */
    .summary-heading {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    .summary-heading h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
    .summary-heading p {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .summary-card {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 12px;
      background: #ffffff;
    }
    .summary-card-favor {
      border-left: 4px solid var(--favor-base);
    }
    .summary-card-against {
      border-left: 4px solid var(--against-base);
    }
    .summary-card-none {
      border-left: 4px solid var(--none-base);
    }
    .summary-card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .summary-card-favor .summary-card-title { color: var(--favor-text); }
    .summary-card-against .summary-card-title { color: var(--against-text); }
    .summary-card-none .summary-card-title { color: var(--none-text); }

    .summary-text {
      font-size: 12.5px;
      line-height: 1.5;
      color: #1e293b;
      margin-bottom: 10px;
    }
    .sources-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    .sources-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-right: 4px;
    }
    .source-chip {
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .source-chip:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Campaign List */
    .campaign-card {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: #ffffff;
      transition: all 0.15s ease;
    }
    .campaign-card:hover {
      border-color: var(--camp-base);
      box-shadow: var(--shadow-sm);
    }
    .campaign-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .campaign-id {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--camp-text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .campaign-id:hover {
      text-decoration: underline;
    }
    .campaign-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .campaign-sample-box {
      font-size: 11.5px;
      font-style: italic;
      color: #475569;
      background: var(--camp-bg);
      border-left: 3px solid var(--camp-base);
      padding: 8px 10px;
      border-radius: 0 4px 4px 0;
      line-height: 1.45;
    }

    /* Benchmark Table */
    .table-responsive {
      overflow-x: auto;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .b-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      text-align: left;
    }
    .b-table th {
      background: #f8fafc;
      padding: 8px 10px;
      font-weight: 700;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      font-family: var(--font-mono);
    }
    .b-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
      color: #334155;
    }
    .b-table tr:last-child td {
      border-bottom: none;
    }
    .b-table tr.highlight-row {
      background: #eff6ff;
      font-weight: 600;
    }
    .b-table tr.highlight-row td {
      color: #1e40af;
    }

    /* Empty state & Loading */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="top-tricolor"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      const [stats, setStats] = useState(null);
      const [clauses, setClauses] = useState([]);
      const [selectedClause, setSelectedClause] = useState("ALL");
      const [comments, setComments] = useState([]);
      const [campaigns, setCampaigns] = useState([]);
      const [summary, setSummary] = useState(null);
      const [activeTab, setActiveTab] = useState("summary"); // summary | campaigns | benchmark
      
      // Filters
      const [stanceFilter, setStanceFilter] = useState("ALL");
      const [campaignOnly, setCampaignOnly] = useState(false);
      const [selectedCluster, setSelectedCluster] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [highlightedId, setHighlightedId] = useState(null);
      const [loading, setLoading] = useState(true);

      // Load Initial Metadata
      useEffect(() => {
        Promise.all([
          fetch("/api/stats").then(r => r.json()),
          fetch("/api/clauses").then(r => r.json()),
          fetch("/api/campaigns").then(r => r.json())
        ]).then(([s, cl, cp]) => {
          setStats(s);
          setClauses(cl);
          setCampaigns(cp);
          setLoading(false);
        }).catch(err => console.error("Error loading initial data:", err));
      }, []);

      // Load Comments on filter change
      useEffect(() => {
        let url = `/api/comments?limit=100`;
        if (selectedClause !== "ALL") url += `&clause_id=${selectedClause}`;
        if (stanceFilter !== "ALL") url += `&stance=${stanceFilter}`;
        if (campaignOnly) url += `&is_campaign=true`;
        if (selectedCluster) url += `&dup_cluster_id=${selectedCluster}`;
        if (searchQuery.trim()) url += `&search=${encodeURIComponent(searchQuery.trim())}`;

        fetch(url)
          .then(r => r.json())
          .then(data => setComments(data.items || []))
          .catch(err => console.error("Error fetching comments:", err));
      }, [selectedClause, stanceFilter, campaignOnly, selectedCluster, searchQuery]);

      // Load Clause Summary
      useEffect(() => {
        const targetClause = selectedClause === "ALL" ? "C2" : selectedClause;
        fetch(`/api/clauses/${targetClause}/summary`)
          .then(r => r.json())
          .then(data => setSummary(data))
          .catch(err => console.error("Error fetching summary:", err));
      }, [selectedClause]);

      // Click on traceable source chip
      const handleSourceClick = (cid) => {
        setSearchQuery(cid);
        setHighlightedId(cid);
        setTimeout(() => {
          const el = document.getElementById(`comment-${cid}`);
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        }, 150);
      };

      if (loading) {
        return (
          <div className="empty-state" style={{ paddingTop: "120px" }}>
            <div className="empty-icon">⏳</div>
            <h2>Initializing eConsult-Intel Policy Engine...</h2>
            <p>Connecting to Ministry of Corporate Affairs SQLite analytics database</p>
          </div>
        );
      }

      return (
        <div className="app-container">
          
          {/* Header */}
          <header>
            <div className="header-left">
              <div className="header-icon">⚖️</div>
              <div className="header-titles">
                <h1>
                  eConsult-Intel
                  <span className="h-badge h-badge-sih">SIH PS 25035</span>
                </h1>
                <p>Ministry of Corporate Affairs (MCA) • Policy Consultation Intelligence & Astroturf Detection</p>
              </div>
            </div>
            <div className="header-badges">
              <span className="h-badge">⚡ 100% Offline Pretrained NLP</span>
              <span className="h-badge">💻 Commodity CPU</span>
              <span className="h-badge">🏛️ MCA21 Legislative Testbed</span>
            </div>
          </header>

          {/* Tripartite Pillars Banner (SIH PS 25035 Core Architecture) */}
          <div className="pillars-bar">
            <div className="pillar-item">
              <span className="pillar-icon">🎯</span>
              <div className="pillar-text">
                <h3>1. Clause-Level Stance Detection</h3>
                <p>Maps claims directly to specific statutory clauses (C1–C6), classifying granular stakeholder stance (Favor, Against, Neutral) rather than coarse document sentiment.</p>
              </div>
            </div>
            <div className="pillar-item">
              <span className="pillar-icon">🛡️</span>
              <div className="pillar-text">
                <h3>2. Coordinated Campaign Flagging</h3>
                <p>Dual-stage MinHash-LSH and SBERT dense clustering identifies verbatim, light, and heavy astroturfing campaigns to prevent flood skewing.</p>
              </div>
            </div>
            <div className="pillar-item">
              <span className="pillar-icon">📑</span>
              <div className="pillar-text">
                <h3>3. Traceable Clause Summaries</h3>
                <p>Synthesizes legal feedback per clause with interactive, clickable evidence citations linking directly to verified citizen submissions.</p>
              </div>
            </div>
          </div>

          {/* Top Key Performance Stats */}
          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-label">Total Submissions</div>
              <div className="stat-val">{stats?.total_comments}</div>
              <div className="stat-sub">Across 6 Companies Bill clauses</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Organic Citizen Feedback</div>
              <div className="stat-val" style={{ color: "var(--favor-text)" }}>
                {stats?.organic_comments}
                <span className="stat-sub">({Math.round(stats?.organic_comments / stats?.total_comments * 100)}%)</span>
              </div>
              <div className="stat-sub">Genuine independent voices</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Coordinated Campaigns</div>
              <div className="stat-val" style={{ color: "var(--camp-text)" }}>
                {stats?.campaign_comments}
                <span className="stat-sub">({stats?.campaign_percentage}%)</span>
              </div>
              <div className="stat-sub">Flagged astroturf submissions</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Astroturf Clusters</div>
              <div className="stat-val">{stats?.unique_campaign_clusters}</div>
              <div className="stat-sub">Identified clusters (K1 - K8)</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Stance Breakdown</div>
              <div className="stat-val" style={{ fontSize: "16px" }}>
                <span style={{ color: "var(--favor-text)" }}>{stats?.stance_distribution?.FAVOR || 0} Favor</span> • 
                <span style={{ color: "var(--against-text)" }}> {stats?.stance_distribution?.AGAINST || 0} Against</span>
              </div>
              <div className="stat-sub">{stats?.stance_distribution?.NONE || 0} Neutral / Clarification</div>
            </div>
          </div>

          {/* Statutory Clauses Selector */}
          <div className="clause-section-header">
            <span>Statutory Clauses Under Review</span>
            <span>Click to isolate clause analysis</span>
          </div>
          <div className="clause-scroll">
            <div 
              className={`clause-card ${selectedClause === "ALL" ? "active" : ""}`}
              onClick={() => { setSelectedClause("ALL"); setSelectedCluster(null); }}
            >
              <div className="clause-card-top">
                <span className="clause-code">ALL CLAUSES</span>
                <span className="clause-count">{stats?.total_comments} total</span>
              </div>
              <div className="clause-title">Full Legislative Consultation</div>
              <div className="meter-bar">
                <div className="meter-favor" style={{ width: "35%" }}></div>
                <div className="meter-against" style={{ width: "40%" }}></div>
                <div className="meter-none" style={{ width: "25%" }}></div>
              </div>
            </div>

            {clauses.map(c => (
              <div
                key={c.clause_id}
                className={`clause-card ${selectedClause === c.clause_id ? "active" : ""}`}
                onClick={() => { setSelectedClause(c.clause_id); setSelectedCluster(null); }}
              >
                <div className="clause-card-top">
                  <span className="clause-code">{c.clause_id}</span>
                  <span className="clause-count">{c.total_comments} ({c.campaign_comments} camp)</span>
                </div>
                <div className="clause-title" title={c.title}>{c.title}</div>
                <div className="meter-bar">
                  <div className="meter-favor" style={{ width: `${c.favor_pct}%` }} title={`Favor: ${c.favor_pct}%`}></div>
                  <div className="meter-against" style={{ width: `${c.against_pct}%` }} title={`Against: ${c.against_pct}%`}></div>
                  <div className="meter-none" style={{ width: `${c.none_pct}%` }} title={`Neutral: ${c.none_pct}%`}></div>
                </div>
              </div>
            ))}
          </div>

          {/* Main Workspace (Feed + Intelligence) */}
          <div className="dashboard-grid">
            
            {/* Left: Feed Panel */}
            <div className="feed-panel">
              <div className="feed-header">
                <div className="feed-search-row">
                  <div className="search-box">
                    <span className="search-icon">🔍</span>
                    <input
                      type="text"
                      className="search-input"
                      placeholder="Search comments by keyword, ID (e.g. C2_ORG_001), or cluster..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>
                  {searchQuery && (
                    <button className="btn-pill" onClick={() => { setSearchQuery(""); setHighlightedId(null); }}>
                      Clear
                    </button>
                  )}
                </div>

                <div className="filter-pills">
                  <button 
                    className={`btn-pill ${stanceFilter === "ALL" ? "active" : ""}`}
                    onClick={() => setStanceFilter("ALL")}
                  >
                    All Stances
                  </button>
                  <button 
                    className={`btn-pill btn-pill-favor ${stanceFilter === "FAVOR" ? "active" : ""}`}
                    onClick={() => setStanceFilter("FAVOR")}
                  >
                    Favor
                  </button>
                  <button 
                    className={`btn-pill btn-pill-against ${stanceFilter === "AGAINST" ? "active" : ""}`}
                    onClick={() => setStanceFilter("AGAINST")}
                  >
                    Against
                  </button>
                  <button 
                    className={`btn-pill ${stanceFilter === "NONE" ? "active" : ""}`}
                    onClick={() => setStanceFilter("NONE")}
                  >
                    Neutral
                  </button>
                  <button 
                    className={`btn-pill btn-pill-camp ${campaignOnly ? "active" : ""}`}
                    onClick={() => setCampaignOnly(!campaignOnly)}
                  >
                    {campaignOnly ? "✓ Campaigns Only" : "Campaigns Only"}
                  </button>

                  {selectedCluster && (
                    <span 
                      className="active-filter-tag"
                      onClick={() => setSelectedCluster(null)}
                      title="Clear cluster filter"
                    >
                      Cluster: {selectedCluster} ✕
                    </span>
                  )}
                </div>
              </div>

              {/* Submissions Cards */}
              <div className="feed-list">
                {comments.length === 0 ? (
                  <div className="empty-state">
                    <div className="empty-icon">📭</div>
                    <h3>No matching stakeholder comments</h3>
                    <p>Try resetting filters or adjusting search terms</p>
                  </div>
                ) : (
                  comments.map(cm => (
                    <div 
                      key={cm.comment_id}
                      id={`comment-${cm.comment_id}`}
                      className={`comment-card ${cm.predicted_stance.toLowerCase()} ${cm.is_campaign ? "is-campaign" : ""} ${highlightedId === cm.comment_id ? "highlighted" : ""}`}
                    >
                      <div className="comment-meta">
                        <span className="badge badge-cid">{cm.comment_id}</span>
                        <span className="badge badge-clause">{cm.matched_clause_id} (sim: {cm.clause_sim})</span>
                        <span className={`badge badge-${cm.predicted_stance.toLowerCase()}`}>
                          {cm.predicted_stance} ({Math.round(cm.stance_conf * 100)}%)
                        </span>
                        <span className="badge badge-stakeholder">{cm.stakeholder_type}</span>
                        {cm.is_campaign ? (
                          <span 
                            className="badge badge-camp"
                            onClick={() => setSelectedCluster(cm.dup_cluster_id)}
                            title="Click to view all comments in this cluster"
                          >
                            ⚠️ {cm.dup_cluster_id} ({cm.paraphrase_level})
                          </span>
                        ) : (
                          <span className="badge badge-stakeholder" style={{ color: "var(--favor-text)" }}>
                            ✓ Organic
                          </span>
                        )}
                        {cm.llm_prob > 0.5 && (
                          <span className="badge badge-ai" title="AI Text Likelihood">
                            🤖 AI-Flag ({Math.round(cm.llm_prob * 100)}%)
                          </span>
                        )}
                      </div>
                      <div className="comment-body">{cm.text}</div>
                    </div>
                  ))
                )}
              </div>
            </div>

            {/* Right: Intelligence Panel */}
            <div className="intel-panel">
              <div className="tab-header">
                <button 
                  className={`tab-btn ${activeTab === "summary" ? "active" : ""}`}
                  onClick={() => setActiveTab("summary")}
                >
                  <span>📑</span> Traceable Summary
                </button>
                <button 
                  className={`tab-btn ${activeTab === "campaigns" ? "active" : ""}`}
                  onClick={() => setActiveTab("campaigns")}
                >
                  <span>🛡️</span> Astroturf Clusters ({campaigns.length})
                </button>
                <button 
                  className={`tab-btn ${activeTab === "benchmark" ? "active" : ""}`}
                  onClick={() => setActiveTab("benchmark")}
                >
                  <span>🔬</span> Empirical Benchmark
                </button>
              </div>

              <div className="tab-body">
                
                {/* 1. Traceable Clause Summary */}
                {activeTab === "summary" && (
                  <div>
                    <div className="summary-heading">
                      <h2>Clause Review: {selectedClause === "ALL" ? "C2 (Default View)" : selectedClause}</h2>
                      <p>Evidence-linked executive summary collapsing flood campaigns into distinct stakeholder policy arguments. Click citation tags to locate specific submissions in the left feed.</p>
                    </div>

                    <div className="summary-card summary-card-favor">
                      <div className="summary-card-title">
                        <span>✓ Arguments In Favor / Support</span>
                      </div>
                      <div className="summary-text">
                        {summary?.favor?.summary || "No support arguments recorded for this clause."}
                      </div>
                      <div className="sources-row">
                        <span className="sources-label">Traceable Sources:</span>
                        {summary?.favor?.sources?.map(src => (
                          <span 
                            key={src} 
                            className="source-chip"
                            onClick={() => handleSourceClick(src)}
                            title="Click to highlight comment"
                          >
                            [{src}]
                          </span>
                        ))}
                      </div>
                    </div>

                    <div className="summary-card summary-card-against">
                      <div className="summary-card-title">
                        <span>✕ Concerns / Arguments Against</span>
                      </div>
                      <div className="summary-text">
                        {summary?.against?.summary || "No opposing arguments recorded for this clause."}
                      </div>
                      <div className="sources-row">
                        <span className="sources-label">Traceable Sources:</span>
                        {summary?.against?.sources?.map(src => (
                          <span 
                            key={src} 
                            className="source-chip"
                            onClick={() => handleSourceClick(src)}
                            title="Click to highlight comment"
                          >
                            [{src}]
                          </span>
                        ))}
                      </div>
                    </div>

                    <div className="summary-card summary-card-none">
                      <div className="summary-card-title">
                        <span>ℹ️ Neutral Clarifications & Inquiries</span>
                      </div>
                      <div className="summary-text">
                        {summary?.none?.summary || "No neutral feedback recorded."}
                      </div>
                      <div className="sources-row">
                        <span className="sources-label">Traceable Sources:</span>
                        {summary?.none?.sources?.map(src => (
                          <span 
                            key={src} 
                            className="source-chip"
                            onClick={() => handleSourceClick(src)}
                            title="Click to highlight comment"
                          >
                            [{src}]
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. Coordinated Astroturf Campaigns */}
                {activeTab === "campaigns" && (
                  <div>
                    <div className="summary-heading">
                      <h2>Identified Coordinated Campaigns (SBERT + Average Linkage)</h2>
                      <p>Cluster threshold θ = 0.48. Click any cluster card to isolate and inspect its member submissions in the main feed.</p>
                    </div>

                    {campaigns.map(cp => (
                      <div key={cp.dup_cluster_id} className="campaign-card">
                        <div className="campaign-top">
                          <span 
                            className="campaign-id"
                            onClick={() => setSelectedCluster(cp.dup_cluster_id)}
                            title="Click to filter feed by this cluster"
                          >
                            ⚠️ {cp.dup_cluster_id}
                          </span>
                          <span className="badge badge-camp">{cp.size} Submissions</span>
                        </div>
                        <div className="campaign-meta">
                          Target Clause: <strong>{cp.clauses.join(", ")}</strong> • Variations: {cp.paraphrase_levels.join(", ")}
                        </div>
                        <div className="campaign-sample-box">
                          "{cp.sample_text}"
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* 3. Empirical Benchmark & Architecture */}
                {activeTab === "benchmark" && (
                  <div>
                    <div className="summary-heading">
                      <h2>Phase 1 Benchmark Evaluation (Test Split, N=72)</h2>
                      <p>Empirical results executed live on local commodity CPU comparing exact hash matching, MinHash-LSH, and dense Sentence-BERT.</p>
                    </div>

                    <div className="table-responsive">
                      <table className="b-table">
                        <thead>
                          <tr>
                            <th>Algorithm</th>
                            <th>Pairwise F1</th>
                            <th>ARI</th>
                            <th>Verbatim Rec.</th>
                            <th>Light Para.</th>
                            <th>Heavy Para.</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td><strong>Exact Hash (MD5)</strong></td>
                            <td>0.1739</td>
                            <td>0.1655</td>
                            <td>100.0%</td>
                            <td>0.0%</td>
                            <td>0.0%</td>
                          </tr>
                          <tr>
                            <td><strong>MinHash-LSH</strong> (θ=0.25)</td>
                            <td>0.6000</td>
                            <td>0.5857</td>
                            <td>100.0%</td>
                            <td>100.0%</td>
                            <td>0.0%</td>
                          </tr>
                          <tr>
                            <td><strong>SBERT Single-Link</strong></td>
                            <td>0.7236</td>
                            <td>0.7022</td>
                            <td>100.0%</td>
                            <td>100.0%</td>
                            <td>93.3%</td>
                          </tr>
                          <tr className="highlight-row">
                            <td><strong>SBERT Average-Link (Proposed)</strong></td>
                            <td>0.8737</td>
                            <td>0.8653</td>
                            <td>100.0%</td>
                            <td>100.0%</td>
                            <td>93.3%</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>

                    <div style={{ marginTop: "16px", fontSize: "12px", color: "var(--text-muted)", lineHeight: "1.5" }}>
                      <p><strong>Key Empirical Finding:</strong> While exact hash match and MinHash-LSH fail completely against heavy paraphrasing (0% recovery), dense Sentence-BERT with average linkage attains an Adjusted Rand Index (ARI) of <strong>0.8653</strong> and recovers <strong>93.33%</strong> of heavy paraphrases on commodity CPU.</p>
                    </div>
                  </div>
                )}

              </div>
            </div>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
